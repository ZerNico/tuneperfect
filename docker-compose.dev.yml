services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tuneperfect
      POSTGRES_PASSWORD: tuneperfect
      POSTGRES_DB: tuneperfect
    ports:
      - 5432:5432
    volumes:
      - .tmp/db:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - 1025:1025
      - 8025:8025
    volumes:
      - .tmp/mailpit:/data

  redis:
    image: redis:latest
    ports:
      - 6379:6379
    volumes:
      - .tmp/redis:/data

  coturn:
    image: coturn/coturn:4.18.0-r0
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "40000-40048:40000-40048/udp"
    command:
      - --listening-port=3478
      - --realm=tuneperfect.localhost
      - --server-name=tuneperfect.localhost
      # Time-limited credentials signed by the API: must match TURN_SECRET in apps/api/.env.
      - --use-auth-secret
      - --static-auth-secret=tuneperfect-dev-turn-secret
      - --min-port=40000
      - --max-port=40048
      - --no-tls
      - --no-tcp-relay
      - --no-multicast-peers
      - --fingerprint
      # Unlike production, private ranges stay reachable: peers are on the LAN or Docker's network.
      - --verbose
      - --log-file=stdout
