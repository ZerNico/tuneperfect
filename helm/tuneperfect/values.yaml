# Default values for tuneperfect chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  image:
    tag: "latest" # Defaulting to latest for local dev, should be overridden by CI/CD with Git tag e.g., v1.0.0.
  # imagePullSecrets:
  #   - name: my-registry-secret

  # ServiceAccount configuration
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    # name: ""
    # Annotations to add to the service account
    # annotations: {}

# Secrets configuration
# These values should be set via helm --set or environment variables in CI/CD
# DO NOT commit actual secret values to version control
secrets:
  api:
    jwtSecret: ""
    emailSmtpUrl: ""
    googleClientId: ""
    googleClientSecret: ""
    discordClientId: ""
    discordClientSecret: ""
    posthogToken: ""

# PostgreSQL configuration
postgresql:
  enabled: true
  image:
    repository: bitnamilegacy/postgresql
    tag: "17.6.0-debian-12-r4"
  auth:
    username: tuneperfect
    database: tuneperfect
    existingSecret: postgresql-credentials
  primary:
    persistence:
      enabled: true
      existingClaim: "{{ .Release.Name }}-postgresql-data"
      size: 1Gi

# Redis configuration
redis:
  enabled: true
  image:
    repository: bitnamilegacy/redis
    tag: "8.2.1-debian-12-r0"
  auth:
    enabled: true
    existingSecret: redis-credentials
    existingSecretPasswordKey: password
  master:
    persistence:
      enabled: true
      existingClaim: "{{ .Release.Name }}-redis-data"
      size: 1Gi
  replica:
    replicaCount: 0

# Uploads storage configuration
uploads:
  persistence:
    enabled: true
    existingClaim: "{{ .Release.Name }}-uploads-data"
    size: 1Gi

# Define applications to deploy
apps:
  web:
    enabled: true
    image:
      repository: ghcr.io/zernico/tuneperfect-web
      pullPolicy: IfNotPresent
      tag: ""
    env:
      VITE_APP_URL: "https://app.tuneperfect.localhost"
    # secrets:
    #   - my-secret-name
    replicaCount: 1
    service:
      type: ClusterIP
      port: 80
      targetPort: 3000
    # resources: {}
    ingress:
      enabled: false
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
        traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
        traefik.ingress.kubernetes.io/router.tls: "true"
      hosts:
        - host: "tuneperfect.localhost"
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - "tuneperfect.localhost"
          secretName: "web-tls"

  app:
    enabled: true
    image:
      repository: ghcr.io/zernico/tuneperfect-app
      pullPolicy: IfNotPresent
      tag: ""
    env:
      VITE_API_URL: "https://api.tuneperfect.localhost"
    # secrets:
    #   - my-secret-name
    replicaCount: 1
    service:
      type: ClusterIP
      port: 80
      targetPort: 3000
    # resources: {}
    ingress:
      enabled: false
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
        traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
        traefik.ingress.kubernetes.io/router.tls: "true"
      hosts:
        - host: "app.tuneperfect.localhost"
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - "app.tuneperfect.localhost"
          secretName: "app-tls"

  api:
    enabled: true
    image:
      repository: ghcr.io/zernico/tuneperfect-api
      pullPolicy: IfNotPresent
      tag: ""
    env:
      API_URL: "https://api.tuneperfect.localhost"
      APP_URL: "https://app.tuneperfect.localhost"
      SUPPORT_EMAIL: "support@tuneperfect.localhost"
      COOKIE_DOMAIN: ".tuneperfect.localhost"
      EMAIL_FROM: "noreply@tuneperfect.localhost"
      TRUSTED_PROXY_ENABLED: "true"
    envFrom:
      - secretRef:
          name: postgresql-credentials
      - secretRef:
          name: redis-credentials
      - secretRef:
          name: api-credentials
    # secrets:
    #   - my-secret-name
    replicaCount: 1
    service:
      type: ClusterIP
      port: 80
      targetPort: 3000
    # resources: {}
    uploads:
      enabled: true
      mountPath: /usr/src/app/uploads
    ingress:
      enabled: false
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
        traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
        traefik.ingress.kubernetes.io/router.tls: "true"
      hosts:
        - host: "api.tuneperfect.localhost"
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - "api.tuneperfect.localhost"
          secretName: "api-tls"

coturn:
  enabled: true
  image:
    repository: coturn/coturn
    # Pinned: read coturn's release notes before bumping (4.17 and 4.18 removed and renamed flags).
    tag: "4.18.0-r0"

  realm: "tuneperfect.localhost"
  stunUrl: "stun:stun.tuneperfect.localhost:3478"
  # TURN is offered once per transport, e.g. turn:<host>:3478?transport=udp and ?transport=tcp.
  host: "turn.tuneperfect.localhost"
  transports: [udp, tcp]

  # The secret TURN credentials are signed with is generated on first install and kept in the
  # coturn-credentials Secret. Set this only to pin it (e.g. for `helm template`).
  authSecret: ""
  # Seconds a TURN credential can open new relays. Clients refetch hourly.
  credentialTtl: 86400

  listeningPort: 3478

  # Larger range supports more concurrent connections
  minPort: 49152
  maxPort: 65535

  # Optional - coturn auto-detects if not set
  externalIp: ""

  # Concurrent relays per credential (the game shares one across all its phones) and in total,
  # bytes per second per relay (data channels carry song lists and covers), and the server's
  # total (0 = unlimited; set it to about half the node's uplink).
  userQuota: 64
  totalQuota: 2000
  maxBps: 1000000
  bpsCapacity: 0

  # Relayed traffic may only reach the public internet: private, loopback, link-local (cloud
  # metadata), shared (CGNAT), documentation and multicast ranges are denied. coturn takes
  # "ip" or "ip-ip", not CIDR, and refuses to start on an invalid entry.
  deniedPeerIps:
    - 0.0.0.0-0.255.255.255
    - 10.0.0.0-10.255.255.255
    - 100.64.0.0-100.127.255.255
    - 127.0.0.0-127.255.255.255
    - 169.254.0.0-169.254.255.255
    - 172.16.0.0-172.31.255.255
    - 192.0.0.0-192.0.0.255
    - 192.0.2.0-192.0.2.255
    - 192.88.99.0-192.88.99.255
    - 192.168.0.0-192.168.255.255
    - 198.18.0.0-198.19.255.255
    - 198.51.100.0-198.51.100.255
    - 203.0.113.0-203.0.113.255
    - 224.0.0.0-255.255.255.255
    - "::1"
    - "64:ff9b:1::-64:ff9b:1:ffff:ffff:ffff:ffff:ffff"
    - "100::-100::ffff:ffff:ffff:ffff"
    - "2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff"
    - "fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff"
    - "fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff"
  # Exceptions to the list above (an allowed address wins over a denied one).
  allowedPeerIps: []

  # Pin coturn to the node its DNS name points at, when the cluster has several.
  nodeSelector: {}

  # resources:
  #   limits:
  #     cpu: 500m
  #     memory: 256Mi
