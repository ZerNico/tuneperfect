{{- if .Values.coturn.enabled }}
{{- $authSecret := include "tuneperfect.coturn.authSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tuneperfect.coturn.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tuneperfect.labels" . | nindent 4 }}
type: Opaque
data:
  # The API signs TURN credentials with it (env TURN_SECRET).
  TURN_SECRET: {{ $authSecret | b64enc | quote }}
  # coturn reads it from a mounted config file, so it never shows up in arguments or environment.
  turnserver.conf: {{ printf "static-auth-secret=%s\n" $authSecret | b64enc | quote }}
{{- end }}
