{{- if .Values.redis.enabled }}
{{- $config := printf "requirepass %q\nbind * -::*\nprotected-mode no\ndir /data\nsave \"\"\nappendonly no\nmaxmemory %s\nmaxmemory-policy allkeys-lru\n" .Values.redis.password .Values.redis.maxmemory }}
# The password is in a config file, not in the command line or the environment.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tuneperfect.fullname" . }}-redis-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tuneperfect.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
type: Opaque
data:
  redis.conf: {{ $config | b64enc | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tuneperfect.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tuneperfect.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tuneperfect.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "tuneperfect.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
      annotations:
        checksum/config: {{ $config | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          args: ["/etc/redis/redis.conf"]
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.redis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/redis
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          secret:
            secretName: {{ include "tuneperfect.fullname" . }}-redis-config
            defaultMode: 0440
        - name: data
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tuneperfect.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tuneperfect.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    {{- include "tuneperfect.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
{{- end }}
