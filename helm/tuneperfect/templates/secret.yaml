apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  password: {{ .Values.database.password | default "" | b64enc | quote }}
  POSTGRES_URL: {{ printf "postgresql://%s:%s@%s:%d/%s" .Values.database.username .Values.database.password .Values.database.host (int .Values.database.port) .Values.database.name | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  password: {{ .Values.redis.password | default "" | b64enc | quote }}
  REDIS_URL: {{ printf "redis://:%s@%s-redis.%s.svc.cluster.local:6379" .Values.redis.password (include "tuneperfect.fullname" .) .Release.Namespace | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: api-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  {{- if .Values.secrets.api.jwtSecret }}
  JWT_SECRET: {{ .Values.secrets.api.jwtSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.api.emailSmtpUrl }}
  EMAIL_SMTP_URL: {{ .Values.secrets.api.emailSmtpUrl | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.api.googleClientId }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.api.googleClientId | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.api.googleClientSecret }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.api.googleClientSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.api.discordClientId }}
  DISCORD_CLIENT_ID: {{ .Values.secrets.api.discordClientId | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.api.discordClientSecret }}
  DISCORD_CLIENT_SECRET: {{ .Values.secrets.api.discordClientSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.api.posthogToken }}
  POSTHOG_TOKEN: {{ .Values.secrets.api.posthogToken | b64enc | quote }}
  {{- end }}
