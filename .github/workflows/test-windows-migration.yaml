# Temporary: installs a Tauri build from the `tauri` branch on a Windows runner, lets it move
# to an Electron build of this branch and checks the result: Electron runs, the data moved,
# the Tauri install is gone and the shortcut starts Electron. Delete once proven.
name: Test Windows migration

on:
  push:
    branches:
      - feat/electron
    paths:
      - .github/workflows/test-windows-migration.yaml
      - apps/game/electron/tauri-migration.ts

jobs:
  migrate:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      # Git Bash would otherwise turn installer flags like /S into paths.
      MSYS_NO_PATHCONV: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          ref: tauri
          path: tauri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: |
          bun install
          (cd tauri && bun install)

      - name: Generate a throwaway signing key
        run: |
          bunx @tauri-apps/cli@2 signer generate --ci -w "$RUNNER_TEMP/update.key"
          echo "UPDATE_PUBKEY=$(cat "$RUNNER_TEMP/update.key.pub")" >> "$GITHUB_ENV"

      - name: Build and sign Electron 0.4.0
        working-directory: apps/game
        env:
          TUNEPERFECT_VERSION: 0.4.0
          TUNEPERFECT_UPDATE_ENDPOINT: "http://127.0.0.1:8765/v1.0/updates/electron/{{target}}/{{arch}}/{{current_version}}"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          TUNEPERFECT_UPDATE_PUBKEY="$UPDATE_PUBKEY" bun run package --arch x64
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/update.key")" bunx @tauri-apps/cli@2 signer sign release/*-setup.exe
          mkdir -p "$RUNNER_TEMP/serve"
          cp release/*-setup.exe "$RUNNER_TEMP/serve/update.exe"
          cp release/*-setup.exe.sig "$RUNNER_TEMP/serve/update.exe.sig"

      - name: Build Tauri 0.3.2
        working-directory: tauri/apps/game
        run: |
          cat > "$RUNNER_TEMP/tauri-config.json" <<EOF
          {
            "identifier": "org.tuneperfect.game",
            "version": "0.3.2",
            "bundle": { "createUpdaterArtifacts": false },
            "app": {
              "windows": [
                {
                  "title": "Tune Perfect",
                  "width": 800,
                  "height": 600,
                  "additionalBrowserArgs": "--remote-debugging-port=9333 --disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection"
                }
              ]
            },
            "plugins": {
              "updater": {
                "pubkey": "$UPDATE_PUBKEY",
                "endpoints": ["http://127.0.0.1:8765/v1.0/updates/{{target}}/{{arch}}/{{current_version}}"],
                "dangerousInsecureTransportProtocol": true
              }
            }
          }
          EOF
          bun run tauri build --bundles nsis --config "$RUNNER_TEMP/tauri-config.json"
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "$RUNNER_TEMP/tauri-setup.exe"

      - name: Install Tauri 0.3.2 and seed its data
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\tauri-setup.exe" -ArgumentList "/S"
          $exe = "$env:LOCALAPPDATA\Tune Perfect\tuneperfect.exe"
          if (-not (Test-Path $exe)) { throw "Tauri app not found at $exe" }
          "TAURI_EXE=$exe" >> $env:GITHUB_ENV
          Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Tune Perfect" | Select-Object DisplayName, DisplayVersion, UninstallString | Format-List
          Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter "Tune Perfect*.lnk" | ForEach-Object { $_.FullName }

          # Settings in the app's format (the store resets anything that doesn't validate).
          $data = "$env:APPDATA\org.tuneperfect.game"
          New-Item -ItemType Directory -Force $data | Out-Null
          @'
          {
            "microphones": [
              { "channel": 0, "color": "sky", "delay": 200, "gain": 2, "name": "USB Microphone", "threshold": 1.5 }
            ],
            "volume": { "game": 0.5, "master": 1, "menu": 0.3, "micPlayback": 1, "preview": 0.3 },
            "version": "1.0.0",
            "songs": { "paths": ["C:\\Songs"] },
            "general": {
              "audioMode": "normal",
              "difficulty": "hard",
              "forceOfflineMode": false,
              "language": "de",
              "micPlaybackEnabled": false,
              "outputLatency": 0,
              "showNoteSegments": true,
              "songSelectStyle": "coverflow"
            }
          }
          '@ | Set-Content -Encoding utf8NoBOM "$data\settings.json"

      - name: Migrate
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cat > "$RUNNER_TEMP/server.ts" <<'EOF'
          import fs from "node:fs";
          const dir = `${process.env.RUNNER_TEMP}/serve`;
          const switchFile = `${process.env.RUNNER_TEMP}/switch-on`;
          Bun.serve({
            port: 8765,
            hostname: "127.0.0.1",
            fetch(req) {
              const url = new URL(req.url);
              console.log(new Date().toISOString().slice(11, 19), req.method, url.pathname);
              if (url.pathname.startsWith("/v1.0/updates/tauri-migration/")) {
                return Response.json({ enabled: fs.existsSync(switchFile) });
              }
              if (url.pathname.startsWith("/v1.0/updates/electron/windows/x86_64/")) {
                if (url.pathname.endsWith("/0.4.0")) return new Response(null, { status: 204 });
                const signature = fs.readFileSync(`${dir}/update.exe.sig`, "utf8").trim();
                return Response.json({ version: "0.4.0", url: "http://127.0.0.1:8765/update.exe", signature });
              }
              if (url.pathname.startsWith("/v1.0/updates/")) return new Response(null, { status: 204 });
              if (url.pathname === "/update.exe") return new Response(Bun.file(`${dir}/update.exe`));
              return new Response(null, { status: 404 });
            },
          });
          console.log("fake API on 8765");
          EOF
          cat > "$RUNNER_TEMP/cdp.ts" <<'EOF'
          // usage: bun cdp.ts text | shot <file> | enter
          const [cmd, arg] = process.argv.slice(2);
          const targets = await (await fetch("http://127.0.0.1:9333/json/list")).json();
          const page = targets.find((t: { type: string }) => t.type === "page");
          const ws = new WebSocket(page.webSocketDebuggerUrl);
          let id = 0;
          const pending = new Map();
          ws.onmessage = (m) => { const d = JSON.parse(String(m.data)); pending.get(d.id)?.(d); };
          const send = (method: string, params = {}): Promise<any> =>
            new Promise((r) => { pending.set(++id, r); ws.send(JSON.stringify({ id, method, params })); });
          await new Promise((r) => (ws.onopen = r));
          if (cmd === "shot") {
            const { result } = await send("Page.captureScreenshot", { format: "png" });
            await Bun.write(arg, Buffer.from(result.data, "base64"));
          } else if (cmd === "enter") {
            await send("Input.dispatchKeyEvent", { type: "keyDown", key: "Enter", code: "Enter", windowsVirtualKeyCode: 13, text: "\r" });
            await send("Input.dispatchKeyEvent", { type: "keyUp", key: "Enter", code: "Enter", windowsVirtualKeyCode: 13 });
          } else {
            const res = await send("Runtime.evaluate", { expression: "document.body.innerText", returnByValue: true });
            console.log(res.result?.result?.value ?? "");
          }
          ws.close();
          EOF
          log="$RUNNER_TEMP/out/server.log"
          wait_for() { for i in $(seq 1 "$2"); do grep -q "$1" "$log" && return 0; sleep 1; done; echo "timed out waiting for $1"; cat "$log"; return 1; }

          bun "$RUNNER_TEMP/server.ts" > "$log" 2>&1 &
          sleep 2

          echo "::group::Switch off: the regular update check runs, nothing migrates"
          "$TAURI_EXE" > "$RUNNER_TEMP/out/tauri-off.log" 2>&1 &
          wait_for "GET /v1.0/updates/windows/x86_64/0.3.2" 120
          if grep -q "GET /v1.0/updates/electron/" "$log"; then echo "asked for the Electron build while the switch was off"; exit 1; fi
          sleep 3
          timeout 20 bun "$RUNNER_TEMP/cdp.ts" shot "$RUNNER_TEMP/out/switch-off.png" || true
          taskkill /IM tuneperfect.exe /F
          for i in $(seq 1 20); do tasklist | grep -qi "^tuneperfect.exe" || break; sleep 1; done
          if tasklist | grep -qi "^tuneperfect.exe"; then echo "the first Tauri run is still running"; exit 1; fi
          echo "::endgroup::"

          echo "::group::Switch on: the Electron build is offered and installed"
          touch "$RUNNER_TEMP/switch-on"
          "$TAURI_EXE" > "$RUNNER_TEMP/out/tauri-on.log" 2>&1 &
          wait_for "GET /v1.0/updates/electron/windows/x86_64/0.3.2" 120
          sleep 5
          echo "--- start screen ---"; timeout 20 bun "$RUNNER_TEMP/cdp.ts" text || true
          timeout 20 bun "$RUNNER_TEMP/cdp.ts" shot "$RUNNER_TEMP/out/offer.png" || true
          timeout 20 bun "$RUNNER_TEMP/cdp.ts" enter
          wait_for "GET /update.exe" 120
          wait_for "GET /v1.0/updates/electron/windows/x86_64/0.4.0" 300
          echo "::endgroup::"
          cat "$log"

      - name: Check the result
        shell: pwsh
        run: |
          $failures = @()

          $electron = Get-CimInstance Win32_Process -Filter "Name = 'Tune Perfect.exe'" | Where-Object { $_.CommandLine -like "*--tp-version=0.4.0*" }
          if ($electron) { "Electron 0.4.0 runs" } else { $failures += "Electron 0.4.0 isn't running" }

          $moved = "$env:APPDATA\Tune Perfect\settings.json"
          if (Test-Path $moved) {
            $settings = Get-Content $moved -Raw | ConvertFrom-Json
            "Moved settings: difficulty=$($settings.general.difficulty), language=$($settings.general.language), mic=$($settings.microphones[0].name), songs=$($settings.songs.paths -join ',')"
            if ($settings.general.difficulty -ne "hard" -or $settings.microphones[0].name -ne "USB Microphone" -or $settings.songs.paths[0] -ne "C:\Songs") {
              $failures += "the moved settings don't match the seed"
            }
          } else { $failures += "no settings.json in the Electron data directory" }
          if (Test-Path "$env:APPDATA\org.tuneperfect.game") { $failures += "the Tauri data directory is still there" } else { "Tauri data directory removed" }

          # The uninstaller runs in the background after Electron started.
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Tune Perfect"
          $deadline = (Get-Date).AddMinutes(2)
          while (((Test-Path $key) -or (Test-Path $env:TAURI_EXE)) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
          if (Test-Path $key) { $failures += "the Tauri uninstall entry is still registered" } else { "Tauri uninstall entry removed" }
          if (Test-Path $env:TAURI_EXE) { $failures += "the Tauri executable is still installed" } else { "Tauri executable removed" }

          $shell = New-Object -ComObject WScript.Shell
          $shortcuts = @("$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Tune Perfect.lnk", "$env:USERPROFILE\Desktop\Tune Perfect.lnk")
          foreach ($lnk in $shortcuts) {
            if (Test-Path $lnk) {
              $target = $shell.CreateShortcut($lnk).TargetPath
              "$lnk -> $target"
              if ($target -notlike "*\Programs\tuneperfect\Tune Perfect.exe") { $failures += "$lnk doesn't start Electron" }
            } elseif ($lnk -like "*Start Menu*") { $failures += "no Start menu shortcut" }
          }

          if ($failures.Count -gt 0) { $failures | ForEach-Object { "FAIL: $_" }; exit 1 }
          "Migrated."

      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\out" | Out-Null
          Copy-Item -Recurse -ErrorAction SilentlyContinue "$env:APPDATA\Tune Perfect\logs" "$env:RUNNER_TEMP\out\electron-logs"
          Copy-Item -Recurse -ErrorAction SilentlyContinue "$env:LOCALAPPDATA\org.tuneperfect.game\logs" "$env:RUNNER_TEMP\out\tauri-logs"
          Get-ChildItem -Recurse -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\out" -Filter *.log | ForEach-Object { "--- $($_.FullName)"; Get-Content $_.FullName -Tail 40 }

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-migration-test
          path: ${{ runner.temp }}/out
