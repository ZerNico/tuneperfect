# The `tauri` branch only builds the last Tauri releases of the game (the ones that move
# installs to Electron). The API, web and app images come from `main`, so they're neither
# built nor deployed from here, and the release never becomes GitHub's latest.
name: Build and create draft release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-game:
    name: Build Game
    uses: ./.github/workflows/tauri-build-game.yaml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  create-draft-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    needs: [build-game]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Game Artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: tuneperfect-*

      - name: Generate Changelog
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          writeToFile: false

      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          make_latest: false
          body: ${{ steps.changelog.outputs.changes }}
          files: artifacts/**/*
          fail_on_unmatched_files: false
