name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run lint . && bun run format:check .

  test-api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run API tests
        working-directory: apps/api
        run: bun test

      - name: Typecheck
        working-directory: apps/api
        run: bunx tsc --noEmit

  test-game:
    name: Game tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend and Electron tests
        working-directory: apps/game
        run: bun run test

      - name: Run native tests
        working-directory: apps/game/native
        run: cargo test

      - name: Check generated TypeScript types are up to date
        run: git diff --exit-code -- apps/game/src/lib/native/types.gen.ts

      - name: Typecheck the Electron main process
        working-directory: apps/game
        # Needs the addon's generated type declarations.
        run: bun run native:build && bunx tsc --noEmit -p electron/tsconfig.json
