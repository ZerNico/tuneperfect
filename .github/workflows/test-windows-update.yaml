# Temporary: installs 0.0.1 on a Windows runner, updates it to 0.0.2 through the in-app
# updater and checks that 0.0.2 is what runs afterwards. Delete once Windows updates are proven.
name: Test Windows update

on:
  push:
    branches:
      - feat/electron
    paths:
      - .github/workflows/test-windows-update.yaml
      - apps/game/electron/updater.ts

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: apps/game
    env:
      TUNEPERFECT_UPDATE_ENDPOINT: "http://127.0.0.1:8765/updates/{{target}}/{{arch}}/{{current_version}}"
      # Git Bash would otherwise turn installer flags like /S into paths.
      MSYS_NO_PATHCONV: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: bun install

      - name: Generate a throwaway signing key
        run: |
          bunx @tauri-apps/cli@2 signer generate --ci -w "$RUNNER_TEMP/update.key"
          echo "TUNEPERFECT_UPDATE_PUBKEY=$(cat "$RUNNER_TEMP/update.key.pub")" >> "$GITHUB_ENV"

      - name: Build 0.0.1
        env:
          TUNEPERFECT_VERSION: 0.0.1
        run: |
          bun run package --arch x64
          mv release/*-setup.exe "$RUNNER_TEMP/old-setup.exe"
          rm -rf release

      - name: Build and sign 0.0.2
        env:
          TUNEPERFECT_VERSION: 0.0.2
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          bun run package --arch x64
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/update.key")" bunx @tauri-apps/cli@2 signer sign release/*-setup.exe
          mkdir -p "$RUNNER_TEMP/update"
          cp release/*-setup.exe "$RUNNER_TEMP/update/update.exe"
          cp release/*-setup.exe.sig "$RUNNER_TEMP/update/update.exe.sig"

      - name: Install 0.0.1
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\old-setup.exe" -ArgumentList "/S"
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Tune Perfect.exe" | Select-Object -First 1
          if (-not $exe) { throw "Tune Perfect.exe not found after install" }
          "Installed at $($exe.FullName), version $($exe.VersionInfo.ProductVersion)"
          "APP_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Update through the app
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cat > "$RUNNER_TEMP/server.ts" <<'EOF'
          const dir = `${process.env.RUNNER_TEMP}/update`;
          const signature = (await Bun.file(`${dir}/update.exe.sig`).text()).trim();
          Bun.serve({
            port: 8765,
            hostname: "127.0.0.1",
            fetch(req) {
              const url = new URL(req.url);
              console.log(req.method, url.pathname);
              if (url.pathname.startsWith("/updates/")) {
                return Response.json({ version: "0.0.2", url: "http://127.0.0.1:8765/update.exe", signature });
              }
              if (url.pathname === "/update.exe") return new Response(Bun.file(`${dir}/update.exe`));
              return new Response(null, { status: 404 });
            },
          });
          console.log("update server on 8765");
          EOF
          cat > "$RUNNER_TEMP/cdp.ts" <<'EOF'
          // usage: bun cdp.ts shot <file> | key Enter | text
          const [cmd, arg] = process.argv.slice(2);
          const targets = await (await fetch("http://127.0.0.1:9333/json/list")).json();
          const page = targets.find((t: { type: string }) => t.type === "page");
          const ws = new WebSocket(page.webSocketDebuggerUrl);
          let id = 0;
          const pending = new Map();
          ws.onmessage = (m) => { const d = JSON.parse(String(m.data)); pending.get(d.id)?.(d); };
          const send = (method: string, params = {}): Promise<any> =>
            new Promise((r) => { pending.set(++id, r); ws.send(JSON.stringify({ id, method, params })); });
          await new Promise((r) => (ws.onopen = r));
          if (cmd === "shot") {
            const { result } = await send("Page.captureScreenshot", { format: "png" });
            await Bun.write(arg, Buffer.from(result.data, "base64"));
          } else if (cmd === "key") {
            await send("Input.dispatchKeyEvent", { type: "keyDown", key: "Enter", code: "Enter", windowsVirtualKeyCode: 13, text: "\r" });
            await send("Input.dispatchKeyEvent", { type: "keyUp", key: "Enter", code: "Enter", windowsVirtualKeyCode: 13 });
          } else {
            const res = await send("Runtime.evaluate", { expression: "document.body.innerText", returnByValue: true });
            console.log(res.result?.result?.value ?? "");
          }
          ws.close();
          EOF

          bun "$RUNNER_TEMP/server.ts" > "$RUNNER_TEMP/out/server.log" 2>&1 &
          sleep 2
          "$APP_EXE" --remote-debugging-port=9333 > "$RUNNER_TEMP/out/app-0.0.1.log" 2>&1 &

          # The start screen asks for updates; wait until it shows the offer.
          for i in $(seq 1 90); do
            grep -q "GET /updates/windows/x86_64/0.0.1" "$RUNNER_TEMP/out/server.log" && break
            sleep 1
          done
          grep -q "GET /updates/windows/x86_64/0.0.1" "$RUNNER_TEMP/out/server.log" || { echo "0.0.1 never checked for updates"; exit 1; }
          sleep 5
          echo "--- start screen ---"; timeout 20 bun "$RUNNER_TEMP/cdp.ts" text || true
          timeout 20 bun "$RUNNER_TEMP/cdp.ts" shot "$RUNNER_TEMP/out/offer.png" || true

          # "Install" is the focused first item.
          timeout 20 bun "$RUNNER_TEMP/cdp.ts" key Enter
          for i in $(seq 1 120); do
            grep -q "GET /update.exe" "$RUNNER_TEMP/out/server.log" && break
            sleep 1
          done
          grep -q "GET /update.exe" "$RUNNER_TEMP/out/server.log" || { echo "0.0.1 never downloaded the update"; exit 1; }

      - name: Check that 0.0.2 runs
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(3)
          do {
            Start-Sleep -Seconds 3
            $running = Get-CimInstance Win32_Process -Filter "Name = 'Tune Perfect.exe'" |
              Where-Object { $_.CommandLine -like "*--tp-version=0.0.2*" }
          } until ($running -or (Get-Date) -gt $deadline)

          $exe = Get-Item $env:APP_EXE
          "Installed version: $($exe.VersionInfo.ProductVersion)"
          Get-CimInstance Win32_Process -Filter "Name = 'Tune Perfect.exe'" | ForEach-Object { $_.CommandLine } | Select-Object -First 5
          if ($exe.VersionInfo.ProductVersion -notlike "0.0.2*") { throw "0.0.2 was not installed" }
          if (-not $running) { throw "0.0.2 did not start after the update" }
          "Updated and relaunched."

      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\out" | Out-Null
          Copy-Item -Recurse -ErrorAction SilentlyContinue "$env:APPDATA\Tune Perfect\logs" "$env:RUNNER_TEMP\out\app-logs"
          Get-ChildItem -Recurse "$env:RUNNER_TEMP\out" | ForEach-Object { $_.FullName }
          Get-Content -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\out\server.log"
          Get-ChildItem -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\out\app-logs" | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName -Tail 60 }

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-update-test
          path: ${{ runner.temp }}/out
