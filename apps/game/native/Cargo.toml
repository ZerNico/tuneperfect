[package]
name = "tuneperfect_native"
version = "0.0.33"
description = "Native audio, song parsing and media server for the Tune Perfect desktop app"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[build-dependencies]
napi-build = "2.5"

[dependencies]
napi = { version = "3.13", default-features = false, features = ["napi8", "tokio_rt", "serde-json"] }
napi-derive = "3.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TypeScript types for the renderer are generated from these (see src/typescript.rs).
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
thiserror = "2"
lofty = "0.25"
cpal = "0.18.2"
ringbuf = "0"
dywapitchtrack = "0.2.0"
rubato = "5.0"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tower-http = { version = "0.7", features = ["fs"] }
tower = "0.5"
percent-encoding = "2.3"
log = "0.4"
md5 = "0.8"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
walkdir = "2"
dunce = "1.0.5"
urlencoding = "2.1.3"
unicode-normalization = "0.1"
encoding_rs = "0.8"
chardetng = "1.0"
num_cpus = "1.17"
semver = "1.0"
reqwest = { version = "0.13", features = ["cookies", "form"] }
scraper = "0.27"
regex = "1"
specta-serde = { version = "0.0.12", optional = true }
specta-typescript = { version = "0.0.12", optional = true }

[features]
# Exports `exportTypescriptTypes`, used by the dev loop to regenerate the renderer's types.
typegen = ["dep:specta-serde", "dep:specta-typescript"]

[dev-dependencies]
specta-serde = "0.0.12"
specta-typescript = "0.0.12"

# Pitch detection and resampling run per audio callback; keep dependencies optimized in
# debug builds so dev performance is representative.
[profile.dev.package."*"]
opt-level = 3
