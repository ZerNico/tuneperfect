[package]
name = "tuneperfect_game"
version = "0.0.33"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tuneperfect_game_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-persisted-scope = "2"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-fs = "2.6.0"
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2"
lofty = "0.25"
cpal = "0.18.2"
ringbuf = "0"
dywapitchtrack = "0.2.0"
rubato = "5.0"
tauri-plugin-shell = "2.4.0"
tauri-plugin-process = "2.4.0"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tower-http = { version = "0.7", features = ["fs"] }
tower = "0.5"
percent-encoding = "2.3"
tauri-plugin-store = "2.5.0"
tauri-plugin-log = "2.10.0"
log = "0.4"
tauri-plugin-os = "2"
md5 = "0.8"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
walkdir = "2"
dunce = "1.0.5"
urlencoding = "2.1.3"
unicode-normalization = "0.1"
encoding_rs = "0.8"
chardetng = "1.0"
num_cpus = "1.17"
semver = "1.0"
webrtc = "0.17"
reqwest = { version = "0.13", features = ["cookies", "form"] }
scraper = "0.27"
regex = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2.5.0"
tauri-plugin-single-instance = "2.5.0"
tauri-plugin-updater = "2.13.0"
tauri-plugin-window-state = "2.5.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.61"
